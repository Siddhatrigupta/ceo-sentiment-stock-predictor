<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEO Sentiment & Stock Predictor</title>

  <!-- Google Fonts + Bootstrap -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f8f9fa, #e9f2ff);
      color: #333;
      min-height: 100vh;
      padding-top: 50px;
    }
    .container {
      max-width: 800px;
      background: #fff;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      font-weight: 600;
      color: #0d6efd;
      margin-bottom: 20px;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ced4da;
      resize: none;
    }
    .btn-analyze {
      width: 100%;
      background-color: #0d6efd;
      color: white;
      font-size: 18px;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      padding: 10px;
      transition: all 0.3s ease;
    }
    .btn-analyze:hover {
      background-color: #0b5ed7;
    }
    .result-card {
      background: #f8f9fa;
      border-left: 5px solid #0d6efd;
      padding: 20px;
      border-radius: 10px;
      margin-top: 25px;
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(10px);}
      to {opacity: 1; transform: translateY(0);}
    }
    .result-card h3 {
      color: #0d6efd;
      font-size: 20px;
      margin-bottom: 8px;
    }
    .emoji {
      font-size: 22px;
      margin-right: 6px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>📊 CEO Sentiment & Stock Predictor</h1>
    <form method="post">
      <label for="text" class="form-label">Enter a CEO Statement:</label>
      <textarea name="text" id="text" placeholder="Type or paste the CEO statement here...">{{ request.form.text }}</textarea>
      <button type="submit" class="btn-analyze mt-3">Analyze Statement</button>
    </form>

    {% if sentiment %}
      <div class="result-card mt-4">
        <h3><span class="emoji">💬</span> Sentiment:</h3>
        <p>{{ sentiment }}</p>

        <h3><span class="emoji">😊</span> Emotion:</h3>
        <p>{{ emotion }}</p>

        <h3><span class="emoji">🎯</span> Tone:</h3>
        <p>{{ tone }}</p>

        <h3><span class="emoji">📈</span> Stock Prediction:</h3>
        <p><strong>{{ stock_prediction }}</strong></p>
      </div>
    {% endif %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
